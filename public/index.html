<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的应用商店</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .app-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            margin-right: 15px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .app-info h3 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .app-info .version {
            color: #666;
            font-size: 0.9rem;
        }

        .app-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .app-size {
            color: #666;
            font-size: 0.9rem;
        }

        .app-category {
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #495057;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📦 我的应用商店</h1>
        <p>免费下载、自动更新、安全可靠</p>
    </header>

    <main class="container">
        <div class="apps-grid" id="appsGrid">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 我的应用商店. 基于 Vercel 构建</p>
    </footer>

    <script>
        // 应用数据 - 从 GitHub Releases 获取
        const GITHUB_REPO = '你的用户名/你的仓库名'; // 替换为你的仓库
        
        // 应用列表（可以从 API 或静态 JSON 加载）
        const apps = [
            {
                id: 'my-app',
                name: '我的应用',
                description: '这是一个示例应用，你可以替换为你的应用信息',
                version: '1.0.0',
                icon: '📱',
                size: '10MB',
                category: '工具',
                downloadUrl: `https://github.com/${GITHUB_REPO}/releases/latest/download/app-release.apk`
            }
        ];

        // 渲染应用列表
        function renderApps() {
            const grid = document.getElementById('appsGrid');
            
            if (apps.length === 0) {
                grid.innerHTML = '<div class="loading">暂无应用</div>';
                return;
            }

            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="window.open('${app.downloadUrl}', '_blank')">
                    <div class="app-header">
                        <div class="app-icon">${app.icon}</div>
                        <div class="app-info">
                            <h3>${app.name}</h3>
                            <span class="version">v${app.version}</span>
                        </div>
                    </div>
                    <p class="app-description">${app.description}</p>
                    <div class="app-footer">
                        <span class="app-size">${app.size}</span>
                        <span class="app-category">${app.category}</span>
                    </div>
                </div>
            `).join('');
        }

        // 初始化
        renderApps();
    </script>
</body>
</html>
